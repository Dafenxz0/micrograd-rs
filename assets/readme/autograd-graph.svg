<text x="510" y="386" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#94A6B5" text-anchor="start" dominant-baseline="alphabetic">a × b</text>
<text x="873" y="440" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#94A6B5" text-anchor="start" dominant-baseline="alphabetic">(a × b) + c</text>
<text x="1229" y="440" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#94A6B5" text-anchor="start" dominant-baseline="alphabetic">[(a × b) + c]²</text>
<rect x="70" y="742" width="1460" height="1" rx="0" fill="#293747"/>
<text x="70" y="779" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#F4F8F5" text-anchor="start" dominant-baseline="alphabetic">a = 2   ·   b = −3   ·   c = 10   ·   L = (ab + c)² = 16</text>
<text x="1530" y="779" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#B9F17D" text-anchor="end" dominant-baseline="alphabetic">∂L/∂a = −24   ·   ∂L/∂b = 16   ·   ∂L/∂c = 8</text>
